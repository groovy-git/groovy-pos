# Builds the phone app and publishes it to GitHub Pages on every push to main.
# Set repo variable VITE_API_URL (Settings → Secrets and variables → Actions → Variables)
# to your Apps Script web app URL.
name: Deploy app to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Check API URL is set
        run: |
          if [ -z "${{ vars.VITE_API_URL }}" ]; then echo "::error::Set the VITE_API_URL repository variable to your Apps Script web app URL"; exit 1; fi
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
